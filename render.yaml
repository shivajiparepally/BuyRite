services:
  - type: web
    name: buyrite-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "bash -c \"python manage.py migrate --noinput && python manage.py ensure_admin && python manage.py seed_demo_data && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT\""
    healthCheckPath: /api/catalog/categories/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        # Render's own internal health check doesn't arrive on the public
        # buyrite-backend.onrender.com hostname, so a single exact value here
        # 400s it. "*" disables Django's Host-header check entirely — safe in
        # this setup because Render's edge proxy is what actually gates which
        # requests reach the container in the first place.
        value: "*"
      - key: CORS_ALLOWED_ORIGIN
        value: "https://shivajiparepally.github.io"
      # Not secret - same for any Gmail SMTP sender - set directly here.
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      # Fill these in on the Render dashboard after the Blueprint is created —
      # never commit real secrets to this file.
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
